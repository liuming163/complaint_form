<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>作品覆盖列表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</head>
<body>
<header class="main-header shadow-sm">
    <div class="logo-area"><i class="fas fa-images"></i> 作品覆盖列表</div>
    <div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <span class="user-info" style="margin-left:16px"><i class="fas fa-user"></i> {{ current_user }}</span>
        <button class="btn btn-sm btn-outline-secondary" style="margin-left:8px" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 登出</button>
    </div>
</header>

<div class="form-page-wrap">
    <div class="form-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="section-title mb-0"><i class="fas fa-images"></i> 作品覆盖列表</div>
            <button class="btn btn-primary" onclick="openAddWorkModal()">
                <i class="fas fa-plus"></i> 新增作品
            </button>
        </div>
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="输入剧名、代理主体(司内)、被代理人信息、内容类型或投诉类型进行搜索..." autocomplete="off">
        </div>
        <div id="resultCount" class="form-text mb-3"></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle" id="worksTable">
                <thead>
                    <tr>
                        <th>剧名</th>
                        <th>代理主体(司内)</th>
                        <th>被代理人信息</th>
                        <th>操作人</th>
                        <th>内容类型</th>
                        <th>投诉类型</th>
                        <th>作品权属文件</th>
                        <th>其他证明</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="worksTableBody">
                    <tr><td colspan="9" class="text-center text-muted py-4">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="emptyState" class="text-center text-muted py-5" style="display:none">
            <i class="fas fa-folder-open fa-3x mb-3"></i>
            <div>暂无作品</div>
        </div>
        <div id="searchEmpty" class="text-center text-muted py-5" style="display:none">
            <i class="fas fa-search fa-3x mb-3"></i>
            <div>未找到匹配的作品</div>
        </div>

        <div id="copyTooltip" class="copy-tooltip">复制成功</div>
    </div>
</div>

<!-- 其他证明弹窗 -->
<div class="modal fade" id="otherProofModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-paperclip me-2"></i><span id="otherProofModalTitle">其他证明</span></div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div id="otherProofModalBody"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 新增作品弹窗 -->
<div class="modal fade" id="addWorkModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-plus me-2"></i>新增作品</div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">请输入剧名</label>
                    <input type="text" class="form-control" id="inputWorkName" placeholder="请输入剧名" onblur="this.value = this.value.trim(); checkWorkNameDuplicate(this.value)">
                    <div class="invalid-feedback d-block" id="workNameError" style="display:none !important;"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">代理主体(司内)</label>
                    <select class="form-select" id="inputUsedCompany" onchange="loadPrincipalOptionsForWork()">
                        <option value="和晞科技">和晞科技</option>
                        <option value="柏蒙文化">柏蒙文化</option>
                        <option value="中惠信科">中惠信科</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">被代理人信息</label>
                    <select class="form-select" id="inputPrincipalName">
                        <option value="">请先选择被代理人信息</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">内容类型</label>
                    <select class="form-select" id="inputContentType">
                        <option value="">请选择内容类型</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">投诉类型</label>
                    <select class="form-select" id="inputComplaintType">
                        <option value="">请选择投诉类型</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">请上传作品权属（此处上传的文件用于投诉时的证明文件） </label>
                    <input type="file" class="form-control" id="inputProofFile" accept=".png,.jpg,.jpeg,.bmp,.pdf">
                    <div class="form-text">上传文件原始名称需以：证明文件_作品名称 开头，例如：证明文件_铳火.png、证明文件_铳火_file.jpg；单文件超过5MB时系统将自动压缩</div>
                    <div class="invalid-feedback d-block" id="proofFileNameError" style="display:none !important;"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">是否还有其他证明文件（最多2个，此处上传的文件用于投诉时的其他证明，除两执照一委托外）</label>
                    <input type="file" class="form-control" id="inputOtherProofFiles" accept=".png,.jpg,.jpeg,.bmp,.pdf" multiple>
                    <div class="form-text">上传文件原始名称需符合：其他证明_作品名称_序号.xxx，例如：其他证明_铳火_1.png；单文件超过5MB时系统将自动压缩</div>
                    <div class="invalid-feedback d-block" id="otherProofFilesNameError" style="display:none !important;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitAddWork()">提交</button>
            </div>
        </div>
    </div>
</div>

<style>
.works-grid {
    display: none;
}
.table td, .table th {
    white-space: nowrap;
    vertical-align: middle;
}
.copy-tooltip {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #198754;
    color: #fff;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
}
.copy-tooltip.show {
    opacity: 1;
}
</style>

<script>
let allWorks = [];
let fuse = null;
let debounceTimer = null;
let addWorkModal = null;
let otherProofModal = null;
let updateProofModal = null;
const WORK_FILE_SIZE_LIMIT = 5 * 1024 * 1024;

function normalizeWorkFilenamePart(value) {
    return (value || '').trim().replace(/（/g, '(').replace(/）/g, ')').replace(/[/:*?"<>|\\：＊？＂＜＞｜＼／]/g, '');
}

function showWorkFileNameError(inputId, errorId, message) {
    const input = document.getElementById(inputId);
    const errorEl = document.getElementById(errorId);
    if (input) input.classList.add('is-invalid');
    if (errorEl) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
    }
}

function clearWorkFileNameError(inputId, errorId) {
    const input = document.getElementById(inputId);
    const errorEl = document.getElementById(errorId);
    if (input) input.classList.remove('is-invalid');
    if (errorEl) {
        errorEl.textContent = '';
        errorEl.style.display = 'none';
    }
}

function validateWorkAssetFilenames(workName, proofFile, otherFiles) {
    const normalizedWorkName = normalizeWorkFilenamePart(workName);
    if (proofFile) {
        const dot = proofFile.name.lastIndexOf('.');
        const stem = normalizeWorkFilenamePart(dot >= 0 ? proofFile.name.slice(0, dot) : proofFile.name);
        const expectedPrefix = `证明文件_${normalizedWorkName}`;
        if (!stem.startsWith(expectedPrefix)) {
            return `作品权属文件名不符合要求，请上传以“${expectedPrefix}”开头的文件`;
        }
    }

    for (const file of (otherFiles || [])) {
        const dot = file.name.lastIndexOf('.');
        const stem = normalizeWorkFilenamePart(dot >= 0 ? file.name.slice(0, dot) : file.name);
        const escapedName = normalizedWorkName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const pattern = new RegExp(`^其他证明_${escapedName}_[0-9]+$`);
        if (!pattern.test(stem)) {
            return `其他证明文件名不符合要求，请上传命名为“其他证明_${normalizedWorkName}_序号.文件后缀”的文件`;
        }
    }

    return '';
}

function validateWorkNameFormat(workName) {
    // 剧名只做两端去空格，中间空格保留（例如 "hello kitty" 原样保存）。
    return '';
}

function checkWorkNameDuplicate(workName) {
    if (!workName) return;
    const exists = allWorks.some(item => item.work_name === workName);
    if (exists) {
        showDuplicateWarning('该作品名称已在作品覆盖列表里面存在，请确认是否需要再次新增');
    }
}

function showDuplicateWarning(msg) {
    let el = document.getElementById('workNameDuplicateWarning');
    if (!el) {
        el = document.createElement('div');
        el.id = 'workNameDuplicateWarning';
        el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff3cd;color:#856404;border:1px solid #ffc107;padding:10px 24px;border-radius:6px;font-size:14px;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,0.15);transition:opacity 0.3s;';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    el.style.display = 'block';
    setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => { el.style.display = 'none'; }, 300);
    }, 5000);
}

function validateWorkNameImmediately() {
    const input = document.getElementById('inputWorkName');
    const workName = input.value.trim();
    clearWorkFileNameError('inputWorkName', 'workNameError');
    if (!workName) return true;
    const msg = validateWorkNameFormat(workName);
    if (msg) {
        showWorkFileNameError('inputWorkName', 'workNameError', msg);
        return false;
    }
    return true;
}

function validateProofFileImmediately() {
    const workName = document.getElementById('inputWorkName').value.trim();
    const proofFile = document.getElementById('inputProofFile').files[0];
    clearWorkFileNameError('inputProofFile', 'proofFileNameError');
    if (!proofFile) return true;
    // 超过5MB不再拦截，交由后端自动压缩
    if (!workName) return true;
    const msg = validateWorkAssetFilenames(workName, proofFile, []);
    if (msg) {
        showWorkFileNameError('inputProofFile', 'proofFileNameError', msg);
        return false;
    }
    return true;
}

function validateOtherProofFilesImmediately() {
    const workName = document.getElementById('inputWorkName').value.trim();
    const otherFiles = Array.from(document.getElementById('inputOtherProofFiles').files || []);
    clearWorkFileNameError('inputOtherProofFiles', 'otherProofFilesNameError');
    if (!otherFiles.length) return true;
    // 超过5MB不再拦截，交由后端自动压缩
    if (!workName) return true;
    const msg = validateWorkAssetFilenames(workName, null, otherFiles);
    if (msg) {
        showWorkFileNameError('inputOtherProofFiles', 'otherProofFilesNameError', msg);
        return false;
    }
    return true;
}

function buildWorkDirName(item) {
    return `${item.work_name}_${item.used_company}_${item.content_type}_${item.complaint_type}`;
}

function buildWorkAssetUrl(item, fileName) {
    return `/api/proof_file/${encodeURIComponent(`剧名/${buildWorkDirName(item)}/${fileName}`)}`;
}

function openOtherProofModal(workId) {
    const item = allWorks.find(w => String(w.id) === String(workId));
    if (!item) return;

    document.getElementById('otherProofModalTitle').textContent = `其他证明 - ${item.work_name}`;
    const body = document.getElementById('otherProofModalBody');
    const files = item.other_proof_files || [];

    if (files.length === 0) {
        body.innerHTML = '<div class="text-muted">暂无其他证明文件</div>';
    } else {
        body.innerHTML = files.map((file, index) => `
            <div class="d-flex justify-content-between align-items-center border rounded px-3 py-2 mb-2">
                <div><i class="fas fa-file me-2 text-primary"></i>${escapeHtml(file)}</div>
                <a href="${buildWorkAssetUrl(item, file)}" target="_blank" class="btn btn-sm btn-outline-primary">打开</a>
            </div>
        `).join('');
    }

    otherProofModal.show();
}

async function loadWorkDictionaries() {
    const [contentRes, complaintRes] = await Promise.all([
        fetch('/api/works/content_types').then(r => r.json()),
        fetch('/api/works/complaint_types').then(r => r.json())
    ]);
    const contentSelect = document.getElementById('inputContentType');
    const complaintSelect = document.getElementById('inputComplaintType');
    if (contentRes.success) {
        contentRes.data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name;
            contentSelect.appendChild(opt);
        });
    }
    if (complaintRes.success) {
        complaintRes.data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name;
            complaintSelect.appendChild(opt);
        });
    }
}

async function loadPrincipalOptionsForWork() {
    const usedCompany = document.getElementById('inputUsedCompany').value;
    const principalSelect = document.getElementById('inputPrincipalName');
    principalSelect.innerHTML = '<option value="">请先选择被代理人信息</option>';
    if (!usedCompany) return;
    const res = await fetch(`/api/works/principal_options?used_company=${encodeURIComponent(usedCompany)}`);
    const data = await res.json();
    if (!data.success) return;
    data.data.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        principalSelect.appendChild(opt);
    });
}

async function loadWorks() {
    const res = await fetch('/api/works/list');
    const data = await res.json();
    if (!data.success) {
        document.getElementById('worksTableBody').innerHTML = '<tr><td colspan="8" class="text-danger text-center py-4">加载失败</td></tr>';
        return;
    }
    allWorks = data.data;
    fuse = new Fuse(allWorks, {
        threshold: 0.3,
        ignoreLocation: true,
        keys: ['work_name', 'used_company', 'principal_name', 'operator_name', 'content_type', 'complaint_type']
    });
    renderWorks(allWorks);
}

function renderWorks(works) {
    const tbody = document.getElementById('worksTableBody');
    const table = document.getElementById('worksTable');
    const emptyState = document.getElementById('emptyState');
    const searchEmpty = document.getElementById('searchEmpty');
    const countEl = document.getElementById('resultCount');
    const searchValue = document.getElementById('searchInput').value.trim();

    tbody.innerHTML = '';
    if (works.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = searchValue ? 'none' : 'flex';
        searchEmpty.style.display = searchValue ? 'flex' : 'none';
        countEl.textContent = '';
        return;
    }

    table.style.display = '';
    emptyState.style.display = 'none';
    searchEmpty.style.display = 'none';
    countEl.textContent = `共 ${works.length} 个作品`;

    works.forEach(item => {
        const tr = document.createElement('tr');
        const proofCell = item.proof_file
            ? `<a href="${buildWorkAssetUrl(item, item.proof_file)}" target="_blank"><i class="fas fa-file-alt me-1"></i>${escapeHtml(item.proof_file)}</a>`
            : '-';
        const otherCount = item.other_proof_count ?? (item.other_proof_files || []).length;
        const otherCell = otherCount > 0
            ? `<button type="button" class="btn btn-sm btn-outline-primary" onclick="openOtherProofModal('${item.id}')"><i class="fas fa-eye me-1"></i>查看(${otherCount})</button>`
            : '0';
        tr.innerHTML = `
            <td>${escapeHtml(item.work_name)}</td>
            <td>${escapeHtml(item.used_company)}</td>
            <td>${escapeHtml(item.principal_name || '-')}</td>
            <td>${escapeHtml(item.operator_name || '-')}</td>
            <td>${escapeHtml(item.content_type)}</td>
            <td>${escapeHtml(item.complaint_type)}</td>
            <td>${proofCell}</td>
            <td>${otherCell}</td>
            <td>${item.can_update ? `<button type="button" class="btn btn-sm btn-outline-warning" onclick="openUpdateProofModal(${item.id}, '${escapeHtml(item.work_name)}')">更新作品权属</button>` : '-'}</td>
        `;
        tbody.appendChild(tr);
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===== 选文件即时预压缩 =====
const COMPRESS_MAX_SIZE = 5 * 1024 * 1024;
// 已确认的最终提交文件，键为 input id，值为 File 数组
const confirmedFiles = {};

function base64ToBlob(b64, mime) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
}

function humanFileSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'MB';
    if (bytes >= 1024) return Math.round(bytes / 1024) + 'KB';
    return bytes + 'B';
}

// 弹出压缩确认框，返回 Promise<boolean>（true=使用压缩后的文件）
function showCompressConfirmModal(info) {
    return new Promise(resolve => {
        const typeWord = info.mime === 'application/pdf' ? 'PDF文件' : '图片';
        const clearWord = info.mime === 'application/pdf' ? '内容清晰' : '清晰';
        const wrapper = document.createElement('div');
        wrapper.className = 'modal fade';
        wrapper.tabIndex = -1;
        wrapper.setAttribute('data-bs-backdrop', 'static');
        wrapper.innerHTML = `
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-compress-alt me-2"></i>${typeWord}超过5MB，已自动压缩</h5>
                    </div>
                    <div class="modal-body">
                        <p class="mb-2">您选择的「${escapeHtml(info.originalName)}」为 ${escapeHtml(info.originalSize)}，超过 5MB 上限，系统已自动压缩至 ${escapeHtml(info.finalSize)}。</p>
                        <p class="mb-2">压缩后文件：${escapeHtml(info.compressedName)}　<a href="${info.blobUrl}" target="_blank">点击查看</a></p>
                        <div class="alert alert-warning mb-0" style="font-size:13px;">
                            请确认压缩后的${typeWord}是否${clearWord}可用：<br>
                            · ${clearWord}可用 → 点「使用压缩后的文件」，将以此文件提交<br>
                            · 不够${clearWord} → 点「取消」，请自行压缩后重新上传（本次不会上传）
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-role="cancel">取消</button>
                        <button type="button" class="btn btn-primary" data-role="confirm">使用压缩后的文件</button>
                    </div>
                </div>
            </div>`;
        document.body.appendChild(wrapper);
        const modal = new bootstrap.Modal(wrapper);
        let result = false;
        wrapper.querySelector('[data-role="confirm"]').addEventListener('click', () => { result = true; modal.hide(); });
        wrapper.querySelector('[data-role="cancel"]').addEventListener('click', () => { result = false; modal.hide(); });
        wrapper.addEventListener('hidden.bs.modal', () => { wrapper.remove(); resolve(result); });
        modal.show();
    });
}

// 对单个 File 做预压缩+确认。返回：要提交的 File（可能是压缩版或原文件），或 null（用户取消/失败，不提交此文件）
async function processOneFile(file) {
    if (!file || file.size <= COMPRESS_MAX_SIZE) return file;
    const fd = new FormData();
    fd.append('file', file);
    let data;
    try {
        const resp = await fetch('/api/compress_preview', { method: 'POST', body: fd });
        data = await resp.json();
    } catch (e) {
        alert(`「${file.name}」压缩失败，请重试或自行压缩后上传`);
        return null;
    }
    if (!data.success) {
        alert(data.error || `「${file.name}」过大且无法自动压缩，请自行压缩后上传`);
        return null;
    }
    if (!data.need_compress) return file;

    const blob = base64ToBlob(data.data_base64, data.mime);
    const blobUrl = URL.createObjectURL(blob);
    const confirmed = await showCompressConfirmModal({
        originalName: data.original_name,
        originalSize: humanFileSize(data.original_size),
        finalSize: humanFileSize(data.final_size),
        compressedName: data.compressed_name,
        mime: data.mime,
        blobUrl,
    });
    if (confirmed) {
        return new File([blob], data.compressed_name, { type: data.mime });
    }
    URL.revokeObjectURL(blobUrl);
    return null;
}

// 处理一个文件框（单选或多选）：逐个预压缩，结果存入 confirmedFiles[inputId]
async function handleFilesCompress(inputId) {
    const input = document.getElementById(inputId);
    delete confirmedFiles[inputId];
    const files = Array.from(input.files || []);
    if (!files.length) return;
    // 没有任何超限文件则无需处理，提交时直接用 input.files
    if (!files.some(f => f.size > COMPRESS_MAX_SIZE)) return;

    const finalFiles = [];
    let anyDropped = false;
    for (const f of files) {
        const result = await processOneFile(f);
        if (result) finalFiles.push(result);
        else anyDropped = true;
    }
    confirmedFiles[inputId] = finalFiles;
    if (anyDropped) {
        if (!finalFiles.length) {
            input.value = '';
            delete confirmedFiles[inputId];
        }
        showWorkToast('部分文件未采用，请确认或重新选择');
    }
}

// 取最终提交文件数组（优先已确认的压缩集）
function getUploadFiles(inputId) {
    if (confirmedFiles[inputId]) return confirmedFiles[inputId];
    return Array.from(document.getElementById(inputId).files || []);
}

function showWorkToast(msg) {
    // works 页无 toast 容器，用轻量提示
    alert(msg);
}

function openAddWorkModal() {
    document.getElementById('inputWorkName').value = '';
    document.getElementById('inputUsedCompany').value = '和晞科技';
    document.getElementById('inputPrincipalName').innerHTML = '<option value="">请先选择被代理人信息</option>';
    document.getElementById('inputContentType').value = '';
    document.getElementById('inputComplaintType').value = '';
    document.getElementById('inputProofFile').value = '';
    document.getElementById('inputOtherProofFiles').value = '';
    delete confirmedFiles['inputProofFile'];
    delete confirmedFiles['inputOtherProofFiles'];
    clearWorkFileNameError('inputWorkName', 'workNameError');
    clearWorkFileNameError('inputProofFile', 'proofFileNameError');
    clearWorkFileNameError('inputOtherProofFiles', 'otherProofFilesNameError');
    loadPrincipalOptionsForWork();
    addWorkModal.show();
}

async function submitAddWork() {
    const workName = document.getElementById('inputWorkName').value.trim();
    const usedCompany = document.getElementById('inputUsedCompany').value;
    const principalName = document.getElementById('inputPrincipalName').value.trim();
    const contentTypeId = document.getElementById('inputContentType').value;
    const complaintTypeId = document.getElementById('inputComplaintType').value;
    const proofFile = getUploadFiles('inputProofFile')[0] || null;
    const otherFiles = getUploadFiles('inputOtherProofFiles');

    if (!workName || !usedCompany || !principalName || !contentTypeId || !complaintTypeId || !proofFile) {
        alert('请填写所有必填项并上传作品权属文件');
        return;
    }
    if (otherFiles.length > 2) {
        alert('其他证明文件最多上传2个');
        return;
    }
    if (!validateWorkNameImmediately()) {
        return;
    }
    if (!validateProofFileImmediately() || !validateOtherProofFilesImmediately()) {
        return;
    }

    const formData = new FormData();
    formData.append('work_name', workName);
    formData.append('used_company', usedCompany);
    formData.append('principal_name', principalName);
    formData.append('content_type_id', contentTypeId);
    formData.append('complaint_type_id', complaintTypeId);
    formData.append('proof_file', proofFile);
    otherFiles.forEach(file => formData.append('other_proof_file', file));

    const res = await fetch('/api/works/add', { method: 'POST', body: formData });
    const data = await res.json();
    if (!data.success) {
        alert('新增失败：' + data.error);
        return;
    }
    addWorkModal.hide();
    await loadWorks();
}

document.getElementById('searchInput').addEventListener('input', function(e) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        const keyword = e.target.value.trim();
        if (!keyword) {
            renderWorks(allWorks);
            return;
        }
        const results = fuse.search(keyword).map(r => r.item);
        renderWorks(results);
    }, 300);
});

document.addEventListener('DOMContentLoaded', () => {
    addWorkModal = new bootstrap.Modal(document.getElementById('addWorkModal'));
    otherProofModal = new bootstrap.Modal(document.getElementById('otherProofModal'));
    updateProofModal = new bootstrap.Modal(document.getElementById('updateProofModal'));
    loadWorkDictionaries();
    loadPrincipalOptionsForWork();
    loadWorks();

    document.getElementById('inputProofFile').addEventListener('change', async () => {
        validateProofFileImmediately();
        await handleFilesCompress('inputProofFile');
    });
    document.getElementById('inputOtherProofFiles').addEventListener('change', async () => {
        validateOtherProofFilesImmediately();
        await handleFilesCompress('inputOtherProofFiles');
    });
    document.getElementById('inputWorkName').addEventListener('blur', () => {
        validateWorkNameImmediately();
        validateProofFileImmediately();
        validateOtherProofFilesImmediately();
    });
    document.getElementById('updateProofFile').addEventListener('change', async () => {
        await handleFilesCompress('updateProofFile');
    });
    document.getElementById('updateOtherProofFiles').addEventListener('change', async () => {
        await handleFilesCompress('updateOtherProofFiles');
    });
});

let _updateProofWorkId = null;

async function openUpdateProofModal(workId, workName) {
    document.getElementById('updateProofError').textContent = '';
    document.getElementById('updateProofFile').value = '';
    document.getElementById('updateOtherProofFiles').value = '';
    delete confirmedFiles['updateProofFile'];
    delete confirmedFiles['updateOtherProofFiles'];
    document.getElementById('updateProofWorkName').textContent = `作品：${workName}`;
    document.getElementById('updateProofSubmitBtn').disabled = false;

    // 检查是否正在投诉中
    const resp = await fetch(`/api/works/check_active/${encodeURIComponent(workName)}`);
    const data = await resp.json();
    if (data.active) {
        alert(`该作品正在投诉中（任务 ${data.task_id}），请稍后再试`);
        return;
    }

    _updateProofWorkId = workId;
    updateProofModal.show();
}

async function submitUpdateProof() {
    const proofFile = getUploadFiles('updateProofFile')[0] || null;
    if (!proofFile) {
        document.getElementById('updateProofError').textContent = '请选择证明文件';
        return;
    }
    const btn = document.getElementById('updateProofSubmitBtn');
    btn.disabled = true;
    document.getElementById('updateProofError').textContent = '';

    const fd = new FormData();
    fd.append('work_id', _updateProofWorkId);
    fd.append('proof_file', proofFile);
    const otherFiles = getUploadFiles('updateOtherProofFiles');
    for (let i = 0; i < Math.min(otherFiles.length, 2); i++) fd.append('other_proof_file', otherFiles[i]);

    const resp = await fetch('/api/works/update_proof', {method: 'POST', body: fd});
    const data = await resp.json();
    if (data.success) {
        updateProofModal.hide();
        loadWorks();
    } else {
        document.getElementById('updateProofError').textContent = data.error || '更新失败';
        btn.disabled = false;
    }
}
</script>
